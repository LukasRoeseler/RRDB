name: Update Zotero CSV

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  update-dataset:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data from Zotero
        run: python fetch_zotero.py

      - name: Commit and Push CSVs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add all CSV files generated by the script
          git add *.csv
          
          # Only commit and push if the CSVs have actually changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update Zotero datasets (including Stage 2 filter)" && git push)
